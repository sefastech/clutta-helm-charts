# Customer-facing values for the Clutta Scan DaemonSet.

image:
  repository: sefastech/clutta-scan
  tag: ""
  pullPolicy: ""
  pullSecret: ""

# Create this Secret from the project-specific setup shown in Clutta Cloud.
credentials:
  existingSecretName: clutta-scan-credentials
  apiKeyKey: api-key
  workspaceIdKey: workspace-id

# What Clutta is allowed to observe. Include rules will be added only when the
# runtime can enforce them end to end; today exclusions are the honest boundary.
scope:
  # Set this to the Clutta project that should receive this installation.
  # Leave it empty only when the workspace default project is intended.
  projectId: ""
  namespaces:
    exclude:
      - kube-system
      - kube-public
      - kube-node-lease

# kubernetes reads pod logs and state through the Kubernetes API and does not
# mount node files. host mounts hostLogs.path. auto enables both collection
# paths and should be selected only when both are required.
collection:
  mode: kubernetes
  hostLogs:
    path: /var/log

# manual detects and records evidence without automatically invoking Analyze.
# automatic permits Clutta to analyze qualifying evidence.
analysis:
  mode: manual

connection:
  mode: cloud
  proxy:
    httpsProxy: ""
    noProxy: ""

telemetry:
  enabled: true

# State is ephemeral by default for compatibility. For node-local persistence,
# pre-create hostPath with uid/gid 65532 ownership and set enabled=true.
persistence:
  enabled: false
  hostPath: /var/lib/clutta-scan

rbac:
  create: true
  serviceAccountName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probes:
  startup:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 36
  readiness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

terminationGracePeriodSeconds: 30
tolerations: []
nodeSelector: {}
affinity: {}
