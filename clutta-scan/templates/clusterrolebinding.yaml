{{- if and .Values.rbac.create (eq (include "clutta-scan.kubernetesEnabled" .) "true") -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "clutta-scan.clusterRoleName" . }}
  labels:
    {{- include "clutta-scan.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "clutta-scan.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
