apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "clutta-scan.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "clutta-scan.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "clutta-scan.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: {{ eq (include "clutta-scan.kubernetesEnabled" .) "true" }}
      {{- if and (eq (include "clutta-scan.kubernetesEnabled" .) "true") .Values.rbac.create }}
      serviceAccountName: {{ .Release.Name }}
      {{- else if eq (include "clutta-scan.kubernetesEnabled" .) "true" }}
      serviceAccountName: {{ required "rbac.serviceAccountName is required when Kubernetes collection is enabled and rbac.create is false" .Values.rbac.serviceAccountName }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scan
          image: "{{ .Values.image.repository }}:{{ include "clutta-scan.imageTag" . }}"
          imagePullPolicy: {{ include "clutta-scan.imagePullPolicy" . }}
          args:
            - scan
            - start
            - --foreground
            - --config
            - /etc/clutta/scan.yaml
          env:
            - name: HOME
              value: /var/clutta
            {{- if eq (include "clutta-scan.kubernetesEnabled" .) "true" }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLUTTA_AGENT_DAEMONSET
              value: {{ .Release.Name | quote }}
            {{- end }}
            {{- if eq .Values.connection.mode "cloud" }}
            - name: CLUTTA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecretName }}
                  key: {{ .Values.credentials.apiKeyKey }}
            - name: CLUTTA_WORKSPACE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecretName }}
                  key: {{ .Values.credentials.workspaceIdKey }}
            - name: CLUTTA_BACKEND_URL
              value: "https://api.clutta.io"
            {{- end }}
            {{- with .Values.connection.proxy.httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.connection.proxy.noProxy }}
            - name: NO_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- if or (eq .Values.connection.mode "local") (not .Values.telemetry.enabled) }}
            - name: CLUTTA_NO_TELEMETRY
              value: "1"
            {{- end }}
          volumeMounts:
            - name: scan-config
              mountPath: /etc/clutta/scan.yaml
              subPath: scan.yaml
              readOnly: true
            {{- if eq (include "clutta-scan.hostLogsEnabled" .) "true" }}
            - name: host-logs
              mountPath: /var/log
              readOnly: true
            {{- end }}
            - name: clutta-state
              mountPath: /var/clutta
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            exec:
              command: ["/usr/local/bin/clutta", "scan", "health"]
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/clutta", "scan", "health", "--ready"]
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/clutta", "scan", "health"]
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
      volumes:
        - name: scan-config
          configMap:
            name: {{ .Release.Name }}-config
        {{- if eq (include "clutta-scan.hostLogsEnabled" .) "true" }}
        - name: host-logs
          hostPath:
            path: {{ .Values.collection.hostLogs.path | quote }}
            type: Directory
        {{- end }}
        - name: clutta-state
          {{- if .Values.persistence.enabled }}
          hostPath:
            path: {{ .Values.persistence.hostPath | quote }}
            type: Directory
          {{- else }}
          emptyDir: {}
          {{- end }}
