apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "clutta-scan.labels" . | nindent 4 }}
data:
  scan.yaml: |
    version: 2
    scope:
      project_id: {{ .Values.scope.projectId | quote }}
      namespaces:
        exclude:
{{ toYaml .Values.scope.namespaces.exclude | indent 10 }}
    collection:
      mode: {{ .Values.collection.mode }}
    analysis:
      mode: {{ .Values.analysis.mode }}
    {{- if .Values.flowDiscovery.enabled }}
    flow_discovery:
      enabled: true
      {{- with .Values.flowDiscovery.correlationField }}
      correlation_field: {{ . | quote }}
      {{- end }}
      window_seconds: {{ .Values.flowDiscovery.windowSeconds }}
      mode: {{ .Values.flowDiscovery.mode }}
    {{- end }}
    connection:
      mode: {{ .Values.connection.mode }}
